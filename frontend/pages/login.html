<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LeaveEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-wrapper">

    <div class="auth-card">
        <div class="auth-logo">
            <i class="fa-solid fa-plane-departure"></i> LeaveEase
        </div>
        <div class="auth-subtitle">Leave Management Portal</div>
        
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="role" class="form-label">I am a</label>
                <select id="role" class="form-select" required>
                    <option value="student" selected>Trainee (Student)</option>
                    <option value="mentor">Mentor</option>
                    <option value="administrator">Administrator</option>
                </select>
                <div class="form-text text-muted">Students can login directly after registration. Mentors need administrator-approved emails. Administrators can approve mentors from the management dashboard.</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                    <input type="email" id="email" class="form-control border-start-0" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
                <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Sign In
            </button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted">Don't have an account? </span>
            <a href="register.html" class="text-decoration-none fw-semibold">Register here</a>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
