<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LeaveEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-wrapper">

    <div class="auth-card">
        <div class="auth-logo">
            <i class="fa-solid fa-plane-departure"></i> LeaveEase
        </div>
        <div class="auth-subtitle">Create a New Account</div>
        
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label for="username" class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                    <input type="text" id="username" class="form-control border-start-0" placeholder="John Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                    <input type="email" id="email" class="form-control border-start-0" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Registering as</label>
                <div class="form-control bg-light text-muted">Trainee (Student) only</div>
                <small class="text-muted">Mentor/Admin accounts must be created by the administrator.</small>
            </div>

            <div class="mb-4" id="batchContainer">
                <label for="batch" class="form-label">Batch Name / Code</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-graduation-cap text-muted"></i></span>
                    <input type="text" id="batch" class="form-control border-start-0" placeholder="e.g. Batch 2026, WebDev-C1">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
                <i class="fa-solid fa-user-plus me-2"></i>Sign Up
            </button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted">Already have an account? </span>
            <a href="login.html" class="text-decoration-none fw-semibold">Login here</a>
        </div>
    </div>

    <script src="../js/register.js"></script>
</body>
</html>
