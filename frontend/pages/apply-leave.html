<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Leave - LeaveEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand-custom" href="student-dashboard.html">
                <i class="fa-solid fa-plane-departure"></i> LeaveEase
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="d-flex align-items-center gap-3">
                    <span class="user-badge">
                        <i class="fa-regular fa-user"></i>
                        <span id="userNameDisplay">Loading...</span>
                    </span>
                    <button class="btn btn-outline-danger btn-sm" id="logoutBtn">
                        <i class="fa-solid fa-arrow-right-from-bracket me-1"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Dashboard Layout -->
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <ul class="sidebar-nav">
                <li class="sidebar-item">
                    <a href="student-dashboard.html" class="sidebar-link">
                        <i class="fa-solid fa-chart-simple"></i> Dashboard
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="apply-leave.html" class="sidebar-link active">
                        <i class="fa-regular fa-paper-plane"></i> Apply for Leave
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="leave-history.html" class="sidebar-link">
                        <i class="fa-solid fa-clock-rotate-left"></i> Leave History
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="mb-4">
                <h2 class="fw-bold mb-1">Apply for Leave</h2>
                <p class="text-muted">Submit a new leave request. Supporting documents are optional but recommended for medical leaves.</p>
            </div>

            <div class="card border-0 shadow-sm p-4" style="max-width: 700px;">
                <div id="alertBox" class="alert d-none" role="alert"></div>

                <form id="leaveForm" enctype="multipart/form-data">
                    <!-- Hidden studentId -->
                    <input type="hidden" name="studentId" id="studentIdInput">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Trainee Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                                <input type="text" name="studentName" id="studentNameInput" class="form-control bg-light border-start-0" readonly>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Batch</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-graduation-cap text-muted"></i></span>
                                <input type="text" name="batch" id="batchInput" class="form-control bg-light border-start-0" readonly>
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="leaveType" class="form-label">Leave Type</label>
                            <select name="leaveType" id="leaveType" class="form-select" required>
                                <option value="" disabled selected>Select Leave Type</option>
                                <option value="Sick Leave">Sick Leave</option>
                                <option value="Personal Leave">Personal Leave</option>
                                <option value="Emergency Leave">Emergency Leave</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="fromDate" class="form-label">Start Date</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fa-regular fa-calendar text-muted"></i></span>
                                <input type="date" name="fromDate" id="fromDate" class="form-control border-start-0" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="toDate" class="form-label">End Date</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fa-regular fa-calendar text-muted"></i></span>
                                <input type="date" name="toDate" id="toDate" class="form-control border-start-0" required>
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="reason" class="form-label">Leave Reason</label>
                            <textarea name="reason" id="reason" class="form-control" rows="4" placeholder="Please provide details of your leave application..." required></textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Supporting Document (Optional)</label>
                            <div class="upload-area" onclick="document.getElementById('document').click()">
                                <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                                <h6 class="fw-semibold mb-1">Click to Upload File</h6>
                                <p class="text-muted small mb-0">PDF, PNG, JPG, JPEG (Max 5MB)</p>
                                <input type="file" name="document" id="document" class="d-none">
                                <div id="fileNameDisplay" class="mt-2 text-primary fw-semibold small"></div>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary px-4 py-2">
                                <i class="fa-regular fa-paper-plane me-2"></i>Submit Application
                            </button>
                            <a href="student-dashboard.html" class="btn btn-outline-secondary px-4 py-2 ms-2">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../js/applyleave.js"></script>
</body>
</html>
