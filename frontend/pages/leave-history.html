<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave History - LeaveEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand-custom" href="student-dashboard.html">
                <i class="fa-solid fa-plane-departure"></i> LeaveEase
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="d-flex align-items-center gap-3">
                    <span class="user-badge">
                        <i class="fa-regular fa-user"></i>
                        <span id="userNameDisplay">Loading...</span>
                    </span>
                    <button class="btn btn-outline-danger btn-sm" id="logoutBtn">
                        <i class="fa-solid fa-arrow-right-from-bracket me-1"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Dashboard Layout -->
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <ul class="sidebar-nav">
                <li class="sidebar-item">
                    <a href="student-dashboard.html" class="sidebar-link">
                        <i class="fa-solid fa-chart-simple"></i> Dashboard
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="apply-leave.html" class="sidebar-link">
                        <i class="fa-regular fa-paper-plane"></i> Apply for Leave
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="leave-history.html" class="sidebar-link active">
                        <i class="fa-solid fa-clock-rotate-left"></i> Leave History
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Leave History</h2>
                    <p class="text-muted">Search, filter, and track all your submitted leave requests.</p>
                </div>
                <div>
                    <button class="btn btn-outline-secondary" id="downloadCsvBtn">
                        <i class="fa-solid fa-file-csv me-2"></i>Download All Records (CSV)
                    </button>
                </div>
            </div>

            <!-- Filters Card -->
            <div class="card border-0 shadow-sm p-4 mb-4">
                <h6 class="fw-bold mb-3"><i class="fa-solid fa-filter me-2 text-primary"></i>Filter & Sort Records</h6>
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label for="filterType" class="form-label small">Leave Type</label>
                        <select id="filterType" class="form-select">
                            <option value="All">All Types</option>
                            <option value="Sick Leave">Sick Leave</option>
                            <option value="Personal Leave">Personal Leave</option>
                            <option value="Emergency Leave">Emergency Leave</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="filterStatus" class="form-label small">Status</label>
                        <select id="filterStatus" class="form-select">
                            <option value="All">All Statuses</option>
                            <option value="Pending">Pending</option>
                            <option value="Approved">Approved</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="sortOrder" class="form-label small">Sort By Date</label>
                        <select id="sortOrder" class="form-select">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- History Table -->
            <div class="card border-0 shadow-sm p-4">
                <div class="table-responsive-custom">
                    <table class="table table-custom">
                        <thead>
                            <tr>
                                <th>Leave Type</th>
                                <th>From Date</th>
                                <th>To Date</th>
                                <th>Reason</th>
                                <th>Document</th>
                                <th>Applied Timestamp</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="historyLeavesBody">
                            <tr>
                                <td colspan="8" class="text-center py-4 text-muted">Loading leave history...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- We link histroy.js exactly as named on the disk -->
    <script src="../js/histroy.js"></script>
</body>
</html>
